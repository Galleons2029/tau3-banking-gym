# Headroom for structured witnesses and model reasoning; a separate experiment.
agent_models:
  - openai/gemini-3.5-flash
  - openai/GLM-5.3-Flash
user_model: openai/gemini-3.5-flash
judge_model: openai/GLM-5.3-Flash
llm_args:
  api_base: http://10.39.62.231:9091/v1
  api_key: not-required
  temperature: 0
  max_tokens: 32768
  timeout: 120
  num_retries: 0
  # These custom model IDs cause LiteLLM to drop reasoning_effort as a normal
  # parameter. extra_body passes it to this gateway unchanged.
  extra_body:
    reasoning_effort: low
