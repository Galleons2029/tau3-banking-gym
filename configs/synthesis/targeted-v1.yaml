# One immutable round. All limits include failed physical calls; no implicit retries.
num_tasks: 3000
pilot_tasks: 20
trials: 4
seed: 42000
workers: 128
llm_concurrency: 128
analysis_batch_bytes: 120000
attribution_timeout: 1800
candidate_attempts: 3
max_total_calls: 1000000
max_audit_calls: 750000
max_total_tokens: 1000000000
# 3020 tasks * 4 teacher conversations; validity uses independent public proofs.
max_rollouts: 12080
teacher_model: openai/GLM-5.3-Flash
reviewer_model: openai/gemini-3.5-flash
settings:
  agent_models: [openai/GLM-5.3-Flash, openai/gemini-3.5-flash]
  user_model: openai/gemini-3.5-flash
  judge_model: openai/gemini-3.5-flash
  simulation_max_steps: 200
  simulation_timeout: 1800
  audit_transport_attempts: 3
  capture_retrieval: bm25_grep
  agent_llm_args: {temperature: 0.7}
  user_llm_args: {temperature: 0}
  llm_args:
    api_base: http://10.39.62.231:9091/v1
    api_key: not-required
    temperature: 0
    max_tokens: 65536
    timeout: 300
    num_retries: 0
    extra_body: {reasoning_effort: high}
